name: Bug
description: Report a bug or unintended behavior
title: "fix: <description>"
labels:
  - fix
assignees:
  - calvinmcelvain

body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is happening?
      placeholder: Describe the bug clearly
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. `tk work --new`
        2. `tk work -a "buy milk"`
        3. `tk work -d 1`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: (Optional) What should happen instead?

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tk --version` (or commit SHA)

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: (Optional) Command output, stack traces, list JSON contents, related issues, etc.
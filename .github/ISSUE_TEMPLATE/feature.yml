name: Feature
description: Propose a new feature or CLI improvement
title: "feat: <description>"
labels:
  - feat
assignees:
  - calvinmcelvain

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What are we adding?
      placeholder: Add a short description of the feature
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why does this feature matter?
      placeholder: (Optional) Explain the workflow, CLI ergonomics, or technical reason

  - type: textarea
    id: usage
    attributes:
      label: Example Usage
      description: (Optional) What would the command look like?
      placeholder: |
        tk work --archive
        tk work.meetings -a "sync with team" -p high

  - type: textarea
    id: implementation
    attributes:
      label: Possible Implementation
      description: Optional notes on how this could work
      placeholder: (Optional) Affected modules (models/storage/render/cli), files, ideas, etc.
name: Tests
description: Add or improve automated/manual testing
title: "test: <description>"
labels:
  - test
assignees:
  - calvinmcelvain

body:
  - type: textarea
    id: scope
    attributes:
      label: Test Scope
      description: What should be tested?
      placeholder: Specific command, model method, storage path, or edge case
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: (Optional) Frameworks, tooling, blockers, related bugs, etc.
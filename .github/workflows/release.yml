name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/taskli/__version__.py"
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Publish the current build to TestPyPI only (no tag, no GitHub
          Release).
        type: choice
        options:
          - testpypi
        default: testpypi

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 - <<'EOF'
          import re
          from pathlib import Path

          text = Path("src/taskli/__version__.py").read_text()
          match = re.search(r'__version__ = "(.*)"', text)

          if not match:
              raise SystemExit("Could not determine version.")

          print(match.group(1))
          EOF
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "$VERSION" =~ (a|b|rc|alpha|beta|dev)[.-]?[0-9]*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already exists
        id: check
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Verify wheel
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"

          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/tk" --help
          "$UV_TOOL_BIN_DIR/taskli" --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: >-
      github.event_name == 'push' && needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on the remote."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub Release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi

          ARGS=(
            "v$VERSION"
            dist/*
            --title "v$VERSION"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"

  # Publishing lives in this workflow because events created with
  # GITHUB_TOKEN (the tag and Release above) do not trigger other workflows.
  # The PyPI trusted publisher must name `release.yml` and environment `prod`.
  # Recovery after a partial failure is "Re-run failed jobs" on the same run
  # (job outputs are preserved); skip-existing lets a partially uploaded
  # release finish.
  publish:
    needs: [build, release]
    if: >-
      github.event_name == 'push' && needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

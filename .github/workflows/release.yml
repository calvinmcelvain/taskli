name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/taskli/__version__.py"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 - <<'EOF'
          import re
          from pathlib import Path

          text = Path("src/taskli/__version__.py").read_text()
          match = re.search(r'__version__ = "(.*)"', text)

          if not match:
              raise SystemExit("Could not determine version.")

          print(match.group(1))
          EOF
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "$VERSION" == *beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already exists
        id: check
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists. Skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.check.outputs.exists == 'false'
        run: uv build

      - name: Verify wheel
        if: steps.check.outputs.exists == 'false'
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"

          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/tk" --help
          "$UV_TOOL_BIN_DIR/taskli" --help

      - name: Upload build artifacts
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(
            "v$VERSION"
            dist/*
            --title "v$VERSION"
            --generate-notes
          )

          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"
[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[project]
name = "taskli-cli"
description = "Simple CLI for tracking todo lists."
readme = "README.md"
authors = [
    {name = "Calvin W. McElvain", email = "mcelvain1@hotmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.12"
keywords = ["todo", "tasks", "cli", "task-list", "productivity", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "pydantic>=2.0",
    "argcomplete>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/calvinmcelvain/taskli"
Repository = "https://github.com/calvinmcelvain/taskli"
Issues = "https://github.com/calvinmcelvain/taskli/issues"
Changelog = "https://github.com/calvinmcelvain/taskli/blob/main/CHANGELOG.md"
Documentation = "https://github.com/calvinmcelvain/taskli/blob/main/docs/reference.md"

[project.scripts]
taskli = "taskli.cli:main"
tk = "taskli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "mypy>=1.8",
    "isort>=5.13",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "src/taskli/__version__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/completions",
    "/docs",
    "/CHANGELOG.md",
    "README.md",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".coverage",
    "*.egg-info",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskli"]

[tool.hatch.build.targets.wheel.shared-data]
"completions" = "share/taskli/completions"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-v",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__init__.py",
    "*/__version__.py",
    "*/tests/*",
    "*/test_*.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "assert_never",
    "pass",
    "@overload",
]
show_missing = true
precision = 2
fail_under = 95

[tool.black]
line-length = 79
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.claude
  | \.eggs
  | \.git
  | \.hatch
  | \.pytest_cache
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 79
extend_skip_glob = [".claude/*"]
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".claude",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "_build",
    "build",
    "dist",
    ".hatch-envs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S105", "S106", "S603"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
